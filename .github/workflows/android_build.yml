name: Android Build & Auto-Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Mihrabi APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Build Environment and Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env

      - name: Build Debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Mihrabi-latest.apk

      - name: Generate Release Metadata JSON
        run: |
          cat <<EOF > version.json
          {
            "versionCode": $((100 + ${{ github.run_number }})),
            "versionName": "1.0.${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "apkFileName": "Mihrabi-latest.apk"
          }
          EOF

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mihrabi-APK
          path: |
            Mihrabi-latest.apk
            version.json

      - name: Publish Automatic GitHub Release for In-App Updater
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "تحديث تطبيق محرابي v1.0.${{ github.run_number }}"
          body: "بناء تلقائي لملف APK من مستودع GitHub جاهز للتحديث الداخلي المباشر داخل تطبيق محرابي."
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            Mihrabi-latest.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
