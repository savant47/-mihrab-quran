name: Android Release APK (GitHub Releases Only)

on:
  push:
    branches: [ "**" ]
    tags-ignore:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Mihrabi Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Release Keystore (Preserving App Upgrade Signature)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          rm -f my-upload-key.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -srckeypass android \
            -destkeystore my-upload-key.jks \
            -deststorepass android \
            -destalias upload \
            -destkeypass android \
            -noprompt
          touch .env

      - name: Build Signed Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          cp "$RELEASE_APK" "Mihrabi-latest.apk"
          cp "$RELEASE_APK" "Mihrabi-release-v1.0.${{ github.run_number }}.apk"

      - name: Generate Release Metadata JSON
        run: |
          cat <<EOF > version.json
          {
            "versionCode": $((100 + ${{ github.run_number }})),
            "versionName": "1.0.${{ github.run_number }}",
            "buildType": "release",
            "commitSha": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "apkFileName": "Mihrabi-latest.apk",
            "versionedApkFileName": "Mihrabi-release-v1.0.${{ github.run_number }}.apk"
          }
          EOF

      - name: Publish Signed Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "إصدار تطبيق محرابي (Release) v1.0.${{ github.run_number }}"
          body: |
            ### 🕌 إصدار رسمي لتطبيق محرابي (Release APK) - الإصدار `v1.0.${{ github.run_number }}`
            - **نوع النسخة:** نسخة Release موقعة وجاهزة للتثبيت والتحديث المباشر (`assembleRelease`).
            - **التحميل المباشر:** قم بتحميل ملف `Mihrabi-latest.apk` أو `Mihrabi-release-v1.0.${{ github.run_number }}.apk` من قسم **Assets** أدناه.
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            Mihrabi-latest.apk
            Mihrabi-release-v1.0.${{ github.run_number }}.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

